# ==============================================================================
# Production Nginx Reverse Proxy Configuration
# Global Accident Intelligence SaaS
# ==============================================================================

# Rate limiting zones: 20 req/s with burst of 50 for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream application servers
upstream fastapi_backend {
    server api:8000;
    keepalive 32;
}

upstream react_frontend {
    server frontend:80;
    keepalive 16;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name accidentintel.com www.accidentintel.com api.accidentintel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accidentintel.com www.accidentintel.com;

    # SSL certificates (Let's Encrypt or corporate CA)
    ssl_certificate /etc/letsencrypt/live/accidentintel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accidentintel.com/privkey.pem;

    # Include SSL hardening configuration
    include /etc/nginx/conf.d/ssl.conf;

    # Client upload limit
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (Note: 'preload' is explicitly omitted until domain and all subdomains are verified live on HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.accidentintel.com https://basemaps.cartocdn.com;" always;

    # Authentication routes with strict rate limiting
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://fastapi_backend/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API routes with general rate limiting
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://fastapi_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health check endpoints for load balancers
    location /health {
        proxy_pass http://fastapi_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend SPA application
    location / {
        proxy_pass http://react_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

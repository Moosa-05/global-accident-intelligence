version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: accident_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-accident_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - accident_network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: accident_backend_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-accident_db}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-accident_db}
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-accident-intelligence-super-secret-jwt-key-2026-global-production-32c}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - ENABLE_RATE_LIMITING=true
      - ENFORCE_MODEL_LICENSING=true
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
      - MLFLOW_ALLOW_FILE_STORE=true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - accident_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accident_frontend_app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - accident_network

volumes:
  postgres_data:
    name: accident_postgres_data

networks:
  accident_network:
    name: accident_saas_network
    driver: bridge
